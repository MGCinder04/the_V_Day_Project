<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rose Day 🌹</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="rose.css">
</head>

<body>

    <a href="index.html" class="back-arrow">←</a>

    <h1 class="shine-text main-title">Happy Rose Day! 🌹</h1>

    <div class="hint-text">Can't find the roses? Try clicking on the field...</div>

    <div class="world" id="world">
        <div class="layer clouds" data-speed="0.2">
            <div class="cloud c1">☁️</div>
            <div class="cloud c2">☁️</div>
            <div class="cloud c3">☁️</div>
            <div class="cloud c4">☁️</div>
            <div class="cloud c5">☁️</div>
            <div class="cloud c6">☁️</div>
        </div>

        <div class="layer mountains-back" data-speed="0.1"></div>
        <div class="layer mountains-front" data-speed="0.3"></div>

        <div class="layer ground" id="ground-area" onclick="plantRose(event)">
            <div id="gardener">
                <img src="rosa.png" alt="Rosa">
            </div>
        </div>
    </div>

    <script src="rose.js"></script>
</body>

</html>
