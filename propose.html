<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Propose Day 💍</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="propose.css">
</head>

<body class="propose-bg">

    <a href="index.html" class="back-arrow" style="color: #ff4d6d;">←</a>

    <div class="proposal-container">

        <img src="https://media.tenor.com/gUiu1zyxfzYAAAAi/bear-kiss-bear-kisses.gif" alt="Cute Bear" class="cute-gif">

        <h1 class="shine-text">Will you be my Valentine? 💍</h1>
        <p>There is no escape... choose wisely! 😈</p>

        <div class="buttons">
            <button class="btn yes-btn" onclick="acceptProposal()">YES! ❤️</button>
            <button class="btn no-btn" id="noBtn" onmouseover="moveButton()" onclick="moveButton()">NO 💔</button>
        </div>
    </div>

    <div id="success-message" class="hidden">
        <h1>Bola tha na, nahi bach ke bhag payegi mujhse 😌 🎉</h1>
        <p>You are officially mine now. No refunds.</p>

        <a href="https://wa.me/?text=YES%20I%20will%20be%20your%20Valentine!%20%F0%9F%92%96" target="_blank"
            class="btn whatsapp-btn">
            Send Confirmation 📱
        </a>
    </div>

    <canvas id="confetti"></canvas>

    <script src="propose.js"></script>
</body>

</html>
